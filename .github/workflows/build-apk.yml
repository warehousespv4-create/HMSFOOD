name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          set -e
          mkdir -p out
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" out/FoodKu-debug.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodKu-debug-apk
          path: out/FoodKu-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: FoodKu APK terbaru
          body: |
            Build otomatis dari commit `${{ github.sha }}`.
            Workflow run: #${{ github.run_number }}
          files: out/FoodKu-debug.apk
          make_latest: true
          overwrite_files: true
